[package]
name = "openktv-rust"
version = "0.4.0"
edition = "2021"
description = "OpenKTV Rust Windows desktop karaoke with LAN phone microphone"
license = "MIT"

[dependencies]
ab_glyph = "0.2"
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
cpal = "0.16"
eframe = "0.33"
futures-util = "0.3"
local-ip-address = "0.6"
qrcode = "0.14"
rcgen = { version = "0.14", features = ["x509-parser", "pem", "crypto"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
time = "0.3"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
